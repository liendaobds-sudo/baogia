name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (tsc + jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # NestJS_Suite đã đồng bộ lên major 11 (xem audit §B1/B8) → không còn xung đột peer,
      # bỏ --legacy-peer-deps, dùng npm ci thuần để build tái lập từ lockfile.
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx jest --runInBand

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
